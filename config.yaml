# =========================================================
# HYPERVIEW2 Challenge - Configuration File
# =========================================================

experiment:
  name: hyperview2_baseline
  random_seed: 42
  strict_validation: false   # Set true to abort pipeline if validation fails

# Data Paths
data:
  root_dir: data
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  gt_csv: data/raw/train_gt.csv
  modalities:
    train:
      - msi_satellite
      - hsi_satellite
      - hsi_airborne
    test:
      - msi_satellite
      - hsi_satellite

# Training
train:
  val_split: 0.7
  shuffle: true
  save_models: true
  model_dir: "features"
  log_transform: true

# Feature Selection (per modality, before PCA)
# variance filter → correlation filter → StandardScaler → PCA
feature_selection:
  use_variance_filter: false
  variance_threshold: 5.0

  use_correlation_filter: false
  correlation_threshold: 0.99

  use_scaler: true

# PCA (n_components per modality)
pca:
  msi: 10
  hsi: 10
  airborne: 30

# Modality Dropout (for airborne HSI)
dropout:
  airborne: 0.05

# Target Variables
targets:
  columns:
    - B
    - Cu
    - Zn
    - Fe
    - S
    - Mn

# XAI
xai:
  enabled: false
  output_dir: xai_results
  wavelengths_path: data\wavelengths.json

# Data Validation
validation:
  enabled: true
  strict: false
  verbosity: summary
  log_dir: logs
  checks:
    gt_columns: true
    gt_missing: true
    gt_negative: true
    modality_alignment: true
    mask_consistency: true
  thresholds:
    max_zero_soil_fraction: 1

# Model
model:
  type: random_forest

  random_forest:
    n_estimators: 1000
    max_depth: 15
    min_samples_split: 5
    min_samples_leaf: 2
    seed: 42
    n_jobs: 2

  xgboost:
    objective: reg:tweedie
    tweedie_variance_power: 1.5
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 5
    seed: 42
    n_jobs: 1
